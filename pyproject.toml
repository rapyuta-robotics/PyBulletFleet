[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybullet-fleet"
version = "0.8.0"
description = "Multi-robot simulation framework with PyBullet"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Yu Okamoto", email = "yuokamoto1988@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pybullet>=3.0.0",
    "numpy>=1.20.0,<2.0",
    "scipy>=1.7.0,<1.15.0",
    "pyyaml>=5.4.0",
    "two-point-interpolation>=1.3.2",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
recording = [
    "imageio[pyav]>=2.9.0",
]
# SDF/COLLADA interop: extract <submesh> parts from multi-part meshes (e.g. the
# RMF Caddy's polaris.dae) so PyBullet renders one assembled model instead of
# overlapping full meshes. Only needed when loading such SDF models (ROS bridge
# / rmf_demos). Lazy-imported in sdf_loader with a full-mesh fallback if absent.
sdf = [
    "trimesh>=4.0",
    "pycollada>=0.8",
]
# OpenUSD static-world import. Kept optional because the OpenUSD Python
# distribution is large and not needed by normal URDF/SDF users.
usd = [
    "usd-core>=25.0,<26.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0,<9",
    "pytest-cov>=4.0.0",
    "psutil>=5.9.0",
    "pyright>=1.1.0",
]
models = [
    "robot_descriptions>=1.10.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=1.0",
]

[project.scripts]
pybullet-fleet = "pybullet_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["pybullet_fleet", "pybullet_fleet.*"]

# Bundled assets shipped inside the wheel (robots/, config/, mesh/ live under
# pybullet_fleet/). Without this, a pip-installed package cannot resolve bundled
# URDFs/configs/meshes.
[tool.setuptools.package-data]
pybullet_fleet = [
    "robots/**/*",
    "config/**/*",
    "mesh/**/*",
    "examples/**/*",
]

[tool.black]
line-length = 127
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | external
  | mesh
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "external/",
    "pybullet_fleet/examples/",
]

[[tool.mypy.overrides]]
module = "pybullet.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pybullet_fleet",
]

[tool.coverage.run]
source = ["pybullet_fleet"]
omit = [
    "*/tests/*",
    "*/external/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.flake8]
max-line-length = 127
extend-ignore = ["E203", "W503", "W293", "W291", "E501", "E722", "F401", "F541", "F841", "Q000", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D202", "D205", "D400", "D401", "D413", "I100", "I201", "I202", "B901", "B902", "C408", "CNL100"]
exclude = [
    ".git",
    "__pycache__",
    "external",
    "mesh",
    "build",
    "dist",
]
per-file-ignores = [
    "__init__.py:F401",
]
